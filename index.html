0 8px;color:var(--muted);font-size:13px}.questionCard .choices{margin-bottom:0}.subtle{color:var(--muted);font-size:13px}.callout{padding:13px 16px;border-radius:11px;background:#eff6ff;color:#193b60;border:1px solid #c9def2;margin:14px 0}.callout.warn{background:var(--paleyellow);border-color:#f5d7a4;color:#684715}.callout.good{background:var(--palegreen);border-color:#b5dec8;color:var(--green)}.callout.bad{background:var(--palered);border-color:#f0c3c5;color:var(--red)}.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px}.result{font-weight:650;margin-top:12px;padding:13px 15px;border-radius:11px}.result.bad{background:var(--palered);border:1px solid #efcbcc;color:var(--red)}.result.good{background:var(--palegreen);border:1px solid #bbdfcd;color:var(--green)}.twoCol{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.counter{font-size:12px;font-weight:750;color:#5b6c82}.claimText{font-size:20px;font-weight:750;color:var(--navy);line-height:1.46}.splitSelect{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.splitSelect>div{min-width:0}.labelBlock{display:block;font-size:13px;font-weight:750;color:#334965;margin-bottom:7px}.select{background:#fff;border:1.5px solid #cbd6e5;border-radius:9px;padding:10px;width:100%;min-height:48px;color:var(--ink)}.stageFoot{margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.checkpoint{background:#f3f8ff;border:1px solid #cfddf0;border-radius:13px;padding:17px;margin-top:14px}.checkpoint h3{margin:0 0 6px}.stepBrief{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px}.checkRow{display:flex;align-items:start;gap:10px;padding:9px 0}.checkRow input{accent-color:var(--blue);width:18px;height:18px;margin-top:3px}.checkRow label{flex:1}.input{width:100%;border:1.5px solid #cbd6e5;border-radius:9px;padding:12px;min-height:46px}.statPanel{display:grid;grid-template-columns:repeat(3,1 <body>
<header class="top"><div class="wrap top-inner"><div class="brand"><div class="brandicon" aria-hidden="true">▤</div><div><strong>Il fascicolo che non torna</strong><span>Controllo qualità e validazione · Laboratorio IA per la PA</span></div></div><div class="header-side"><span class="tag">Individuale</span><span class="tag">25–30 minuti</span><span class="tag">Offline</span></div></div></header>
<main id="app" aria-live="polite"></main>
<div id="printReport" class="printonly" aria-hidden="true"></div>
<footer class="foot wrap">Simulazione didattica con documenti, cifre e output IA interamente fittizi · Nessun dato viene inviato a servizi esterni · Nessuna decisione amministrativa reale</footer>
<script>
'use strict';
const DOCS=[
 {id:'A',title:'Procedura interna per le manutenzioni',meta:'Estratto didattico · PM-04 · v2.1',paras:[
  {id:'A-01',title:'§ 2 · Segnalazioni ordinarie',text:'Le segnalazioni ordinarie ricevute sono prese in carico entro tre giorni lavorativi dalla ricezione. Il termine riguarda la presa in carico, non il completamento dell’intervento.'},
  {id:'A-02',title:'§ 3 · Gestione delle urgenze',text:'Le urgenze sono classificate da personale competente e seguono un percorso differenziato di priorità e assegnazione. Non è previsto un termine generale di chiusura uguale per tutte le urgenze.'},
  {id:'A-03',title:'§ 4 · Chiusura degli interventi',text:'Un intervento si considera chiuso dopo l’esecuzione e la registrazione dell’esito tecnico. La procedura non stabilisce un termine generalizzato per il completamento di tutti gli interventi.'}
 ]},
 {id:'B',title:'Report trimestrale sulle segnalazioni',meta:'Estratto didattico · RT-09 · trimestre considerato',paras:[
  {id:'B-01',title:'§ 1 · Volumi di attività',text:'Nel trimestre sono state ricevute 120 segnalazioni. Di queste, 96 sono state prese in carico e 68 risultano chiuse. Le tre grandezze indicano fasi differenti della lavorazione.'},
  {id:'B-02',title:'§ 2 · Tempi di presa in carico',text:'Tra le 96 segnalazioni prese in carico, 72 sono state prese in carico entro tre giorni lavorativi e 24 oltre tale termine. Il rapporto 72/96 corrisponde al 75% delle segnalazioni prese in carico.'},
  {id:'B-03',title:'§ 3 · Indicatori non disponibili',text:'Il report non riporta la durata media di chiusura degli interventi e non comprende una serie storica confrontabile sui tempi di completamento.'}
 ]},
 {id:'C',title:'Nota operativa sulle eccezioni',meta:'Estratto didattico · NO-02 · stessa finestra temporale',paras:[
  {id:'C-01',title:'§ 1 · Segnalazioni urgenti',text:'Nel trimestre, tra le 120 segnalazioni ricevute, cinque sono state classificate urgenti: tre interventi risultano chiusi e due sono ancora in corso.'},
  {id:'C-02',title:'§ 2 · Limiti dei confronti',text:'Le urgenze seguono la gestione differenziata prevista dalla procedura. Nel valutare i termini ordinari non si devono estendere automaticamente alle urgenze gli stessi indicatori, né confondere presa in carico e conclusione.'}
 ]}
];
const CLAIMS=[
 {id:'C1',label:'Nel trimestre sono pervenute 120 segnalazioni.',status:'confermata',evidence:['B-01'],action:'mantieni',note:'Il totale è espresso nel report: 120 segnalazioni ricevute.'},
 {id:'C2',label:'L’80% delle segnalazioni è stato risolto.',status:'errata',evidence:['B-01'],action:'correggi',note:'96 su 120 è l’80% delle prese in carico. Le chiuse sono 68 su 120 (circa 56,7%).'},
 {id:'C3',label:'La procedura impone di completare tutti gli interventi entro tre giorni lavorativi.',status:'errata',evidence:['A-01','A-03'],action:'correggi',note:'I tre giorni riguardano la presa in carico ordinaria, non la chiusura; inoltre 24 prese in carico superano il termine.'},
 {id:'C4',label:'Il 75% delle segnalazioni prese in carico lo è stato entro tre giorni lavorativi.',status:'confermata',evidence:['B-02'],action:'mantieni',note:'72 su 96 prese in carico corrisponde al 75%.'},
 {id:'C5',label:'Tutte le segnalazioni urgenti risultano concluse.',status:'errata',evidence:['C-01'],action:'correggi',note:'Delle cinque urgenze, tre sono chiuse e due sono ancora in corso.'},
 {id:'C6',label:'Il tempo medio di chiusura è diminuito del 20% rispetto al trimestre precedente.',status:'non_determinabile',evidence:['B-03'],action:'sospendi',note:'Non ci sono né una media di chiusura né una serie storica confrontabile: il dato va rimosso/sospeso finché non è documentato.'},
 {id:'C7',label:'Non sono previste eccezioni procedurali per le segnalazioni urgenti.',status:'errata',evidence:['A-02','C-02'],action:'correggi',note:'Le urgenze seguono una gestione differenziata; ometterla altera il significato del report.'}
];
const TRIAGE=[
 {id:'T1',title:'Quale approccio è proporzionato?',options:[['lettura','Leggo soltanto il titolo e mi affido alla fluidità del testo.'],['strutturato','Uso una checklist, controllo i dati sulle fonti e registro i risultati.'],['secondo','Faccio confermare tutto da una seconda IA e firmo.']],answer:'strutturato',hint:'Hai più fonti, date e percentuali: il controllo deve essere strutturato.'},
 {id:'T2',title:'Dove concentro prima l’attenzione?',options:[['stile','Tono, titoli e lunghezza dei paragrafi.'],['fatti','Percentuali, scadenze, urgenze e affermazioni non supportate.'],['grafica','Impaginazione e scelta dei caratteri.']],answer:'fatti',hint:'Le parti a maggior rischio sono quelle su fatti, importi, termini e condizioni.'},
 {id:'T3',title:'La bozza può essere utilizzata ora?',options:[['si','Sì: è ben scritta e ha un aspetto istituzionale.'],['no','No: prima bisogna riscontrare le affermazioni e ottenere la validazione prevista.'],['ai','Sì, purché una seconda IA dica che va bene.']],answer:'no',hint:'La fluidità e il secondo parere non sostituiscono le verifiche sulle fonti.'}
];
const CHECKLIST=[
 {id:'K1',text:'Il totale delle segnalazioni è 120.',relevant:true},
 {id:'K2',text:'La percentuale dell’80% riguarda le pratiche risolte.',relevant:true},
 {id:'K3',text:'La procedura prevede 3 giorni per completare gli interventi.',relevant:true},
 {id:'K4',text:'Il 75% è calcolato sul totale pertinente.',relevant:true},
 {id:'K5',text:'Le urgenze risultano tutte chiuse.',relevant:true},
 {id:'K6',text:'Il tempo medio di chiusura è diminuito del 20%.',relevant:true},
 {id:'K7',text:'Non esistono eccezioni procedurali per le urgenze.',relevant:true},
 {id:'K8',text:'Il titolo è abbastanza accattivante.',relevant:false},
 {id:'K9',text:'La scelta del carattere tipografico è gradevole.',relevant:false}
];
const CROSS=[
 {id:'X1',title:'Un secondo modello conferma: «80% delle segnalazioni risolte». Che fai?',options:[['accetto','Accetto: due IA concordano.'],['fonte','Riapro il report originale e verifico che cosa indica il 96/120.'],['media','Faccio la media tra le due risposte.']],answer:'fonte',hint:'Due modelli possono commettere lo stesso errore.'},
 {id:'X2',title:'Il secondo parere usa «tre giorni» per dire che gli interventi sono conclusi. Come valuti?',options:[['prova','È una prova: la seconda IA ha usato lo stesso termine.'],['procedura','Controllo la procedura e distinguo presa in carico da conclusione.'],['omesso','Ignoro le scadenze perché sono dettagli.']],answer:'procedura',hint:'Una scadenza si verifica sempre rispetto all’evento che disciplina.'},
 {id:'X3',title:'Il secondo modello non trova problemi. Si può dichiarare il documento validato?',options:[['si','Sì, il controllo incrociato equivale a validazione.'],['no','No, la persona deve riscontrare i fatti e seguire il percorso di validazione dell’ente.'],['caso','Solo se il risultato contiene meno di dieci righe.']],answer:'no',hint:'Il secondo parere è un segnale, non una certificazione.'}
];
const STEPS=['Avvio','Valuta la bozza','VER-01','Apri le fonti','Secondo parere','Correggi','Traccia','Esito'];
const state={step:0,ans:{},attempted:{},points:0,completed:{},currentClaim:0,currentAction:0,source:'A',notice:'',validation:{},mistakes:0};
const MAX=3+1+CLAIMS.length+CROSS.length+CLAIMS.length;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const labelStatus={confermata:'Confermata dalla fonte',errata:'Errata / contraddetta dalla fonte',non_determinabile:'Non dimostrabile con le fonti disponibili'};
const labelAction={mantieni:'Mantieni dopo il controllo',correggi:'Correggi e ricontrolla',sospendi:'Sospendi / non utilizzare finché non documentata'};
function rememberFirst(key,correct){if(!Object.hasOwn(state.attempted,key)){state.attempted[key]=true;if(correct)state.points++;else state.mistakes++;}}
function setNotice(message,type='bad'){state.notice={message,type};render();}
function start(){state.step=1;state.notice='';render();scrollTop();}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function chooseSource(id){state.source=id;const panel=$('sourcePanel');if(panel) panel.outerHTML=sourceHTML();}
function sourceHTML(){const d=DOCS.find(x=>x.id===state.source);return `<aside class="sourcePanel" id="sourcePanel" aria-label="Fascicolo e fonti originali del caso"><div class="sourceHeader"><strong>📁 Fascicolo di lavoro</strong><span class="pill">Fonti fittizie</span></div><div class="sourceTabs" role="tablist" aria-label="Documenti del fascicolo">${DOCS.map(s=>`<button type="button" class="sourceTab ${d.id===s.id?'selected':''}" role="tab" aria-selected="${d.id===s.id}" onclick="chooseSource('${s.id}')">Documento ${s.id}</button>`).join('')}</div><div class="docBody" role="tabpanel"><div class="docTitle">${esc(d.title)}</div><div class="docMeta">${esc(d.meta)}</div>${d.paras.map(p=>`<div class="sourcePara"><strong>${esc(p.id)} · ${esc(p.title)}</strong><p>${esc(p.text)}</p></div>`).join('')}<div class="fakeNote">DOCUMENTO ORIGINALE DEL CASO DIDATTICO · Nessun rapporto con enti o procedimenti reali.</div></div></aside>`;}
function quoteHTML(){return `<div class="quote error"><span class="stepBrief">Bozza IA · relazione non verificata</span><p><strong>Relazione trimestrale sulle manutenzioni</strong><br><br>Nel periodo sono state ricevute <b>120 segnalazioni</b>. <b>L'80% è stato risolto</b> e <b>la procedura impone di completare tutti gli interventi entro tre giorni lavorativi</b>. Il <b>75% delle segnalazioni prese in carico lo è stato entro tre giorni lavorativi</b>. <b>Tutte le segnalazioni urgenti risultano concluse</b>. Rispetto al trimestre precedente, <b>il tempo medio di chiusura è diminuito del 20%</b>. <b>Non sono previste eccezioni procedurali per le segnalazioni urgenti</b>.<br><br>In conclusione, l’organizzazione dimostra un funzionamento efficiente.</p></div>`;}
function introHTML(){return `<div class="wrap"><div class="introHero"><div><div class="eyebrow">Sessione 3 · Blocco 4 · Controllo qualità e validazione</div><h1>Il fascicolo<br>che non torna</h1><p class="lead">Una relazione ben scritta arriva sulla scrivania del dirigente. Contiene numeri, scadenze e conclusioni rassicuranti. <strong>Ma possiamo utilizzarla?</strong> Sarai tu a scoprirlo, verificando una bozza IA su tre fonti originali del caso didattico.</p><div class="controls" style="justify-content:start"><button class="btn btn-orange" type="button" onclick="start()">Inizia la revisione →</button><span class="tag dark">Nessun account richiesto</span></div></div><div class="grid-stats"><div class="mini-stat"><div class="bigstat">3</div><strong>documenti</strong><div class="subtle">del caso didattico</div></div><div class="mini-stat"><div class="bigstat">7</div><strong>affermazioni</strong><div class="subtle">da riscontrare</div></div><div class="mini-stat"><div class="bigstat">6</div><strong>passaggi</strong><div class="subtle">con ostacoli</div></div><div class="mini-stat"><div class="bigstat">30′</div><strong>circa</strong><div class="subtle">lavoro individuale</div></div></div></div><div class="intro-list"><div class="card"><div class="iconBlock">🔎</div><h3>Trova l’errore</h3><p>Distingui numeri sbagliati, citazioni deformate e affermazioni senza prove.</p></div><div class="card"><div class="iconBlock">📚</div><h3>Risali alle fonti</h3><p>Una seconda risposta dell’IA non basta: servono passaggi documentali precisi.</p></div><div class="card"><div class="iconBlock">📝</div><h3>Lascia traccia</h3><p>Decidi che cosa correggere e compila una scheda di revisione.</p></div></div><div class="privacyNote">🔒 <b>Non caricare documenti reali.</b> L'esercitazione è completamente simulata e resta nel tuo browser. Nessun collegamento a modelli IA, server o strumenti esterni.</div></div>`;}
function progressHTML(){return `<div class="progress-block wrap"><div class="topline"><strong>Il tuo percorso di verifica</strong><span class="counter">Fase ${state.step} di 6 · ${Math.round(Math.min(1,(state.step-1)/6)*100)}% completato</span></div><div class="progress-track" aria-label="Avanzamento dell'esercitazione"><div class="progress-fill" style="width:${Math.min(100,Math.max(0,((state.step-1)/6)*100))}%"></div></div><div class="steps">${STEPS.slice(1,7).map((t,i)=>`<span class="step ${state.step===i+1?'active':''} ${state.step>i+1?'done':''}">${state.step>i+1?'✓ ':''}${i+1}. ${esc(t)}</span>`).join('')}</div></div>`;}
function noticeHTML(){return state.notice?`<div class="result ${state.notice.type==='good'?'good':'bad'}" role="status">${esc(state.notice.message)}</div>`:'';}
function sourceLink(){return `<button type="button" class="btn btn-secondary btn-small mobileSource" onclick="document.getElementById('sourcePanel').scrollIntoView({behavior:'smooth'})">📚 Consulta le fonti ↓</button>`;}
function choiceHTML(key,options){return `<div class="choices">${options.map(([v,l])=>`<label class="choice"><input type="radio" name="${esc(key)}" value="${esc(v)}" ${state.ans[key]===v?'checked':''} onchange="state.ans['${key}']=this.value;state.notice=''"/><span>${esc(l)}</span></label>`).join('')}</div>`;}
function stage1(){return `<div class="card"><div class="stepBrief">Fase 1 · 3 minuti</div><h1>La relazione è pronta?</h1><p class="sectionLead">Il dirigente ti chiede un controllo prima di utilizzare la relazione. Leggi la bozza e scegli come avviare il lavoro.</p>${quoteHTML()}${TRIAGE.map(q=>`<section class="questionCard"><h3>${esc(q.title)}</h3>${choiceHTML(q.id,q.options)}</section>`).join('')}${noticeHTML()}<div class="controls"><span class="subtle">Tre decisioni operative. Non serve ancora riscrivere la relazione.</span><button class="btn" type="button" onclick="submitTriage()">Verifica le scelte →</button></div></div>`;}
function submitTriage(){let all=true;const wrong=[];for(const q of TRIAGE){const a=state.ans[q.id];if(!a){setNotice('Rispondi a tutte e tre le domande prima di proseguire.');return;}const correct=a===q.answer;rememberFirst(q.id,correct);if(!correct){all=false;wrong.push(q.hint);}}if(all){state.completed[1]=true;advance(2);}else setNotice('Rivedi le tue scelte: '+wrong.join(' '));}
function stage2(){return `<div class="card"><div class="stepBrief">Fase 2 · 5 minuti · VER-01</div><h1>Costruisci la checklist</h1><p class="sectionLead">Non controllare soltanto lo stile. Seleziona le <strong>7 affermazioni della bozza</strong> che richiedono un riscontro fattuale o documentale. Due voci sono distrattori.</p><div class="callout">VER-01 significa prima di tutto <b>sapere che cosa controllare</b>: numeri, percentuali, soggetti, scadenze, eccezioni, affermazioni non documentate.</div><div class="choices">${CHECKLIST.map(k=>`<label class="choice"><input type="checkbox" name="check" value="${k.id}" ${state.ans[k.id]?'checked':''} onchange="state.ans['${k.id}']=this.checked;state.notice='';document.getElementById('checkcount').textContent=CHECKLIST.filter(x=>state.ans[x.id]).length"/><span>${esc(k.text)}</span></label>`).join('')}</div><p class="subtle">Selezionate: <strong id="checkcount">${CHECKLIST.filter(k=>state.ans[k.id]).length}</strong> di 7.</p>${noticeHTML()}<div class="controls"><span class="subtle">Non stai validando le affermazioni: stai creando la lista dei controlli.</span><button class="btn" onclick="submitChecklist()">Controlla VER-01 →</button></div></div>`;}
function submitChecklist(){const selected=CHECKLIST.filter(x=>state.ans[x.id]).map(x=>x.id);if(selected.length===0){setNotice('Seleziona le affermazioni che richiedono un controllo.');return;}const correct=selected.length===7&&CHECKLIST.every(x=>!!state.ans[x.id]===x.relevant);rememberFirst('K',correct);if(correct){state.completed[2]=true;advance(3);}else setNotice(`Hai selezionato ${selected.length} voci. Cerca le sette affermazioni verificabili sul fascicolo; impaginazione e stile non sono un controllo fattuale prioritario.`);}
function statusOptions(){return Object.entries(labelStatus).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');}
const EVIDENCES=DOCS.flatMap(d=>d.paras.map(p=>({id:p.id,label:`${p.id} · ${p.title}`})));
function stage3(){if(state.currentClaim>=CLAIMS.length){return `<div class="card"><div class="stepBrief">Fase 3 completata</div><h1>Hai controllato tutte e sette le affermazioni</h1><p class="sectionLead">Ora possiamo mettere alla prova l'apparente certezza del secondo parere automatico.</p><div class="callout good">✓ Hai consultato le fonti del fascicolo e distinto i fatti confermati da quelli errati o non dimostrabili.</div><div class="controls"><button class="btn" onclick="advance(4)">Passa al secondo parere →</button></div></div>`;}
const c=CLAIMS[state.currentClaim];return `<div class="card"><div class="stepBrief">Fase 3 · 7–8 minuti · Riscontro sulle fonti</div><h1>Apri le fonti originali</h1><p class="sectionLead">Per ogni affermazione scegli l'esito <strong>e il passaggio del fascicolo</strong> che lo giustifica. Il riscontro della persona vale più dell'apparente sicurezza di qualunque IA.</p><div class="topline"><span class="counter">Affermazione ${state.currentClaim+1} di ${CLAIMS.length}</span>${sourceLink()}</div><div class="progress-track"><div class="progress-fill" style="width:${(state.currentClaim/CLAIMS.length)*100}%"></div></div><div class="quote"><div class="stepBrief">${esc(c.id)} · Testo presente nella bozza</div><div class="claimText">«${esc(c.label)}»</div></div><div class="splitSelect"><div><label for="status" class="labelBlock">Come classifichi questa affermazione?</label><select id="status" class="select" onchange="state.ans['${c.id}_status']=this.value;state.notice=''"> <option value="">Seleziona l'esito...</option>${Object.entries(labelStatus).map(([k,v])=>`<option value="${k}" ${state.ans[c.id+'_status']===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div><label for="evidence" class="labelBlock">Quale passaggio è decisivo?</label><select id="evidence" class="select" onchange="state.ans['${c.id}_ev']=this.value;state.notice=''"> <option value="">Scegli una fonte...</option>${EVIDENCES.map(e=>`<option value="${e.id}" ${state.ans[c.id+'_ev']===e.id?'selected':''}>${esc(e.label)}</option>`).join('')}</select></div></div>${noticeHTML()}<div class="controls"><span class="subtle">💡 I documenti A, B e C sono a disposizione nel fascicolo.</span><button class="btn" onclick="checkClaim()">Verifica affermazione →</button></div></div>`;}
function checkClaim(){const c=CLAIMS[state.currentClaim];const s=state.ans[c.id+'_status'],e=state.ans[c.id+'_ev'];if(!s||!e){setNotice('Per proseguire scegli sia l’esito sia il riferimento puntuale alla fonte.');return;}const good=s===c.status&&c.evidence.includes(e);rememberFirst(c.id,good);if(good){state.validation[c.id]=true;state.currentClaim++;state.notice='';if(state.currentClaim===CLAIMS.length)state.completed[3]=true;render();scrollTop();}else{setNotice((s!==c.status?'Rileggi la frase e distingui se è smentita, confermata o soltanto non dimostrabile. ':'')+(c.evidence.includes(e)?'L’estratto scelto è pertinente, ma ricontrolla la classificazione.':'La fonte selezionata non è quella che contiene il riscontro decisivo. Consulta gli estratti A, B e C.'));}}
function stage4(){return `<div class="card"><div class="stepBrief">Fase 4 · 4 minuti · Confronto incrociato</div><h1>Un secondo parere ti dà ragione. O no?</h1><p class="sectionLead">Un'altra IA autorizzata, nella nostra simulazione, ha rivisto la bozza. La sua risposta sembra rassicurante. <strong>Non è una prova.</strong></p><div class="quote error"><div class="stepBrief">Secondo parere IA · Simulazione intenzionalmente fallibile</div><p>«Ho ricontrollato la relazione. La percentuale dell’80% risulta plausibile. Il termine di tre giorni dimostra che le attività sono state concluse nei tempi. Non emergono criticità sostanziali, pertanto il documento può considerarsi corretto.»</p></div>${CROSS.map(q=>`<section class="questionCard"><h3>${esc(q.title)}</h3>${choiceHTML(q.id,q.options)}</section>`).join('')}${noticeHTML()}<div class="controls"><span class="subtle">La concordanza fra risposte non certifica l'esattezza.</span><button class="btn" onclick="submitCross()">Controlla il secondo parere →</button></div></div>`;}
function submitCross(){for(const q of CROSS){if(!state.ans[q.id]){setNotice('Completa tutte le tre decisioni sul secondo parere.');return;}}const wrong=[];for(const q of CROSS){const good=state.ans[q.id]===q.answer;rememberFirst(q.id,good);if(!good)wrong.push(q.hint);}if(wrong.length)setNotice('Attenzione: '+wrong.join(' '));else{state.completed[4]=true;advance(5);}}
function stage5(){if(state.currentAction>=CLAIMS.length){return `<div class="card"><div class="stepBrief">Fase 5 completata</div><h1>Hai deciso cosa mantenere, correggere o sospendere</h1><div class="callout good">✓ I fatti confermati sono stati conservati, gli errori corretti e le affermazioni non documentabili sospese.</div><p>La versione che ne risulta è ancora una <b>bozza revisionata</b>. Serve documentare il controllo prima di sottoporla alla persona competente per la validazione.</p><div class="controls"><button class="btn" onclick="advance(6)">Compila la traccia →</button></div></div>`;}
const c=CLAIMS[state.currentAction];return `<div class="card"><div class="stepBrief">Fase 5 · 5 minuti · Decisioni operative</div><h1>Correggi o sospendi?</h1><p class="sectionLead">Hai consultato le fonti e non ti sei fatto condizionare dal secondo parere. Ora scegli che cosa fare con ciascuna frase.</p><div class="counter">Intervento ${state.currentAction+1} di ${CLAIMS.length}</div><div class="quote"><div class="claimText">«${esc(c.label)}»</div><p class="subtle">Esito documentale già accertato: <strong>${esc(labelStatus[c.status])}</strong>.</p></div><div class="choices">${Object.entries(labelAction).map(([k,v])=>`<label class="choice"><input type="radio" name="action" value="${k}" ${state.ans[c.id+'_act']===k?'checked':''} onchange="state.ans['${c.id}_act']=this.value;state.notice=''"/><span>${esc(v)}</span></label>`).join('')}</div>${noticeHTML()}<div class="controls"><span class="subtle">Un'informazione non dimostrabile non diventa corretta perché è plausibile.</span><button class="btn" onclick="checkAction()">Registra decisione →</button></div></div>`;}
function checkAction(){const c=CLAIMS[state.currentAction];const a=state.ans[c.id+'_act'];if(!a){setNotice('Scegli quale azione applicare alla frase.');return;}const good=a===c.action;rememberFirst('A'+c.id,good);if(good){state.currentAction++;if(state.currentAction===CLAIMS.length)state.completed[5]=true;state.notice='';render();scrollTop();}else setNotice(c.status==='non_determinabile'?'La fonte non dispone del dato necessario: non puoi inventarlo o conservarlo come accertato.':c.status==='confermata'?'Il dato è riscontrato e non richiede una correzione fattuale.':'La fonte contraddice l’affermazione: occorre correggerla, non conservarla nella forma originaria.');}
function stage6(){const v=state.validation;return `<div class="card"><div class="stepBrief">Fase 6 · 4–5 minuti · Registro di validazione</div><h1>Lascia traccia delle verifiche</h1><p class="sectionLead">Il documento può essere presentato come <b>bozza revisionata da sottoporre a validazione</b>, non come atto approvato. Compila una mini scheda documentale senza inserire dati personali reali.</p><div class="checkpoint"><h3>Riepilogo degli accertamenti</h3><p class="subtle">Fonte A — Procedura; Fonte B — Report; Fonte C — Nota eccezioni. Hai riscontrato ${Object.keys(state.validation).length} affermazioni sulla base del fascicolo.</p><p class="subtle">Esito: 2 affermazioni confermate · 4 da correggere · 1 da sospendere perché non dimostrabile.</p></div><div class="questionCard"><label class="labelBlock" for="register-id">Identificativo della bozza (solo caso didattico)</label><input id="register-id" class="input" value="${esc(state.ans.registryId??'REL-MANUT-TRIM · BOZZA v0.1')}" oninput="state.ans.registryId=this.value" maxlength="80" autocomplete="off"><div style="height:14px"></div><label class="labelBlock" for="register-tool">Sistema o ambiente usato nel laboratorio</label><select id="register-tool" class="select" onchange="state.ans.regTool=this.value"><option value="">Seleziona...</option><option value="simulazione" ${state.ans.regTool==='simulazione'?'selected':''}>Simulazione IA offline (nessun modello collegato)</option><option value="reale" ${state.ans.regTool==='reale'?'selected':''}>Seconda IA reale non autorizzata</option></select><div style="height:14px"></div><label class="labelBlock" for="register-state">Stato del documento dopo il controllo</label><select id="register-state" class="select" onchange="state.ans.regState=this.value"><option value="">Seleziona...</option><option value="bozza" ${state.ans.regState==='bozza'?'selected':''}>Bozza revisionata da sottoporre a validazione</option><option value="firmato" ${state.ans.regState==='firmato'?'selected':''}>Documento firmato e inviato automaticamente</option></select><div style="height:14px"></div><label class="labelBlock" for="register-note">Osservazione finale (minimo 20 caratteri)</label><textarea id="register-note" class="input" maxlength="450" placeholder="Esempio: ricontrollate le percentuali; per il tempo medio manca una fonte comparativa..." oninput="state.ans.regNote=this.value">${esc(state.ans.regNote??'')}</textarea></div><div class="checkpoint"><strong>Conferma il perimetro del tuo controllo</strong><label class="checkRow"><input type="checkbox" id="register-confirm" ${state.ans.regConfirm?'checked':''} onchange="state.ans.regConfirm=this.checked"><span>Ho confrontato le affermazioni con le fonti del caso didattico. Il giudizio di un'IA non equivale a una validazione umana.</span></label></div>${noticeHTML()}<div class="controls"><span class="subtle">La scheda può essere esportata al termine. Nessuna informazione viene inviata online.</span><button class="btn" onclick="completeRegister()">Chiudi il laboratorio →</button></div></div>`;}
function completeRegister(){const id=(state.ans.registryId??'REL-MANUT-TRIM · BOZZA v0.1').trim();const note=(state.ans.regNote??'').trim();if(id.length<5||note.length<20){setNotice('Inserisci un identificativo di almeno 5 caratteri e un’osservazione finale di almeno 20 caratteri.');return;}if(state.ans.regTool!=='simulazione'){setNotice('Nel laboratorio è stata usata soltanto una simulazione IA offline. Non dichiarare strumenti mai impiegati.');return;}if(state.ans.regState!=='bozza'){setNotice('Un esercizio non può produrre un documento firmato: il corretto stato finale è una bozza revisionata da sottoporre a validazione.');return;}if(!state.ans.regConfirm){setNotice('Conferma che hai riscontrato le affermazioni sul fascicolo e che la validazione finale resta umana.');return;}state.ans.registryId=id;state.ans.regNote=note;state.completed[6]=true;state.step=7;render();scrollTop();}
function advance(s){state.step=s;state.notice='';render();scrollTop();}
function revisedText(){return `RELAZIONE TRIMESTRALE SULLE MANUTENZIONI — BOZZA REVISIONATA\n\nNel trimestre sono state ricevute 120 segnalazioni, delle quali 96 prese in carico e 68 chiuse (Fonte B-01). Le segnalazioni chiuse rappresentano circa il 56,7% di quelle ricevute; le prese in carico rappresentano l’80%.\n\nTra le 96 segnalazioni prese in carico, 72 (75%) risultano prese in carico entro tre giorni lavorativi e 24 oltre il termine (Fonte B-02). La procedura prevede tre giorni lavorativi per la presa in carico ordinaria, non per il completamento dell’intervento (Fonti A-01, A-03).\n\nLe segnalazioni urgenti sono state cinque: tre risultano chiuse e due in corso (Fonte C-01). Le urgenze seguono una gestione differenziata (Fonti A-02, C-02).\n\nNON INSERITO: il presunto miglioramento del 20% del tempo medio di chiusura, poiché non è documentato da un indicatore e da una serie storica confrontabile (Fonte B-03).\n\nSTATO: bozza revisionata da sottoporre alla verifica e alla validazione della persona competente secondo le regole dell’ente.`;}
function reportText(){let s=`IL FASCICOLO CHE NON TORNA\nLaboratorio individuale · Controllo qualità e validazione\n\n`;s+=`STATO: BOZZA REVISIONATA · NON FIRMATA NÉ VALIDATA AUTOMATICAMENTE\n`;s+=`Identificativo: ${state.ans.registryId}\nAmbiente: Simulazione IA offline\nFonti: Procedura PM-04 v2.1 (A); Report RT-09 (B); Nota NO-02 (C)\n\n`;s+=`SCORE DIDATTICO: ${state.points}/${MAX} risposte corrette al primo tentativo. Questo punteggio NON misura la validità amministrativa.\n\nVERIFICHE\n`;CLAIMS.forEach(c=>s+=`${c.id}. ${c.label}\n   Esito: ${labelStatus[c.status]}; riferimento: ${c.evidence.join(' o ')}; azione: ${labelAction[c.action]}.\n   Motivazione: ${c.note}\n`);s+=`\nOSSERVAZIONI DEL PARTECIPANTE\n${state.ans.regNote}\n\nVERSIONE REVISIONATA DI RIFERIMENTO (ESEMPIO DIDATTICO)\n${revisedText()}\n\nATTENZIONE: nessuna persona ha firmato o validato un procedimento reale; il documento è esclusivamente fittizio.`;return s;}
function downloadReport(){const text=reportText();const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='Il_fascicolo_che_non_torna_Riepilogo.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function printReport(){const pr=$('printReport');pr.innerHTML=printHTML();window.print();}
function printHTML(){return `<h1>Il fascicolo che non torna</h1><p><strong>Laboratorio individuale sulla revisione delle risposte IA · CASO DIDATTICO</strong></p><p>STATO: <strong>BOZZA REVISIONATA NON VALIDATA</strong><br>Documento: ${esc(state.ans.registryId)}<br>Ambiente: Simulazione IA offline<br>Fonti: Procedura A · Report B · Nota C</p><p>Punteggio formativo al primo tentativo: ${state.points}/${MAX}. Il punteggio non costituisce validazione amministrativa.</p><h2>Controlli effettuati</h2><table><thead><tr><th>Voce</th><th>Esito</th><th>Fonte</th><th>Azione</th></tr></thead><tbody>${CLAIMS.map(c=>`<tr><td>${esc(c.id)} · ${esc(c.label)}</td><td>${esc(labelStatus[c.status])}</td><td>${esc(c.evidence.join(' / '))}</td><td>${esc(labelAction[c.action])}</td></tr>`).join('')}</tbody></table><h2>Osservazioni</h2><p>${esc(state.ans.regNote)}</p><h2>Esempio di testo revisionato</h2><p style="white-space:pre-wrap">${esc(revisedText())}</p><p><strong>Avvertenza:</strong> simulazione fittizia. Nessuna firma, approvazione o validazione reale.</p>`;}
function stage7(){const confirmed=CLAIMS.filter(c=>c.action==='mantieni').length, corrected=CLAIMS.filter(c=>c.action==='correggi').length,suspended=CLAIMS.filter(c=>c.action==='sospendi').length;return `<div class="card"><div class="stepBrief">Laboratorio completato · Esito</div><h1>La bozza è stata revisionata</h1><p class="sectionLead">Hai verificato le affermazioni, scelto le correzioni e documentato i riscontri. <b>Non hai approvato né firmato un atto.</b></p><div class="statPanel"><div class="statBlock"><b>${confirmed}</b><span>Affermazioni mantenute</span></div><div class="statBlock"><b>${corrected}</b><span>Affermazioni corrette</span></div><div class="statBlock"><b>${suspended}</b><span>Affermazioni sospese</span></div></div><div class="callout good">✓ Hai completato il percorso. Punteggio didattico al primo tentativo: <strong>${state.points} / ${MAX}</strong> (${Math.round(state.points/MAX*100)}%). Gli errori sono stati corretti prima di chiudere.</div><div class="finalNotice"><strong>Stato amministrativo simulato: BOZZA REVISIONATA DA SOTTOPORRE A VALIDAZIONE.</strong><br>La firma e l'uso effettivo richiedono i controlli e le responsabilità previsti dall'ente. L'app non può certificare la correttezza di un documento reale.</div><div class="reportSection"><h3>Traccia didattica</h3><table class="reportTable"><tr><th>Documento</th><td>${esc(state.ans.registryId)}</td></tr><tr><th>Ambiente</th><td>Simulazione IA offline, senza modelli collegati</td></tr><tr><th>Fonti</th><td>A · Procedura; B · Report; C · Nota eccezioni</td></tr><tr><th>Verifiche</th><td>7 affermazioni riscontrate, con riferimenti documentali</td></tr><tr><th>Esiti</th><td>2 mantenute, 4 corrette, 1 sospesa</td></tr><tr><th>Note del partecipante</th><td>${esc(state.ans.regNote)}</td></tr><tr><th>Firma</th><td>Non prevista · Caso didattico</td></tr></table></div><div class="reportSection"><h3>Esempio di bozza revisionata</h3><div class="quote"><p style="white-space:pre-wrap">${esc(revisedText())}</p></div><p class="subtle">Il testo è un modello didattico illustrativo: va sempre verificato e adattato da una persona in contesti reali.</p></div><div class="controls noPrint"><button class="btn" onclick="downloadReport()">↓ Scarica riepilogo .txt</button><button class="btn btn-secondary" onclick="printReport()">⎙ Stampa / Salva come PDF</button><button class="btn btn-ghost" onclick="restart()">Ricomincia da zero</button></div></div>`;}
function restart(){if(!confirm('Vuoi azzerare risposte e punteggio e ripetere il laboratorio?'))return;location.reload();}
function render(){let out;if(state.step===0){$('app').innerHTML=introHTML();return;}if(state.step===7){out=stage7();}else out=({1:stage1,2:stage2,3:stage3,4:stage4,5:stage5,6:stage6})[state.step]();$('app').innerHTML=progressHTML()+`<div class="wrap labLayout"><section class="workspace">${out}</section>${sourceHTML()}</div>`;}
render();
</script>
</body>
</html>
